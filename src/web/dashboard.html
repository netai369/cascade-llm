<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetAI Cascade LLM - NetAI Stack SE</title>
  <link rel="stylesheet" href="/theme/netai-theme.css">
  <script src="/theme/netai-theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }
    nav { display: flex; justify-content: center; gap: 1rem; margin-top: 0.8rem; padding-bottom: 0.8rem; flex-wrap: wrap; }
    nav a {
      color: var(--text-muted); text-decoration: none; font-size: 0.85rem;
      padding: 0.3rem 0.8rem; border-radius: 6px; transition: all 0.15s;
    }
    nav a:hover, nav a.active { color: var(--accent); background: var(--accent-soft-bg); }
    main { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--card-border); border-radius: 12px;
      padding: 1.2rem; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .card:hover { border-color: var(--accent); box-shadow: 0 0 20px var(--ring); }
    .card .label { font-size: 0.75rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; }
    .card .value { font-size: 1.8rem; font-weight: 700; margin: 0.3rem 0 0; }
    .card .value.cyan { color: var(--accent); }
    .card .value.purple { color: #a78bfa; }
    .card .value.pink { color: #ec4899; }
    .card .value.green { color: var(--success); }
    :root[data-theme='light'] .card .value.purple { color: #7c3aed; }
    :root[data-theme='light'] .card .value.pink { color: #db2777; }
    .charts { display: grid; grid-template-columns: 2fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
    .chart-box {
      background: var(--card);
      border: 1px solid var(--card-border); border-radius: 12px; padding: 1.2rem;
    }
    .chart-box h3 { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.8rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    thead th {
      text-align: left; padding: 0.7rem 0.6rem; border-bottom: 1px solid var(--card-border);
      color: var(--text-faint); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
    }
    tbody td { padding: 0.6rem; border-bottom: 1px solid var(--table-row-border); }
    .badge {
      display: inline-block; padding: 0.15rem 0.55rem; border-radius: 9999px;
      font-size: 0.75rem; font-weight: 600;
    }
    .badge-active { background: var(--success-bg); color: var(--success); }
    .badge-inactive { background: var(--idle-bg); color: var(--idle); }
    .provider-section {
      background: var(--card);
      border: 1px solid var(--card-border); border-radius: 12px; padding: 1.2rem;
    }
    .provider-section h3 { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.8rem; }
    footer { text-align: center; padding: 1.5rem; color: var(--text-faint); font-size: 0.8rem; }
    @media (max-width: 640px) { header p { display: none; } }
    @media (max-width: 768px) { .charts { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
    <header>
    <div class="bar">
    <div class="brand">
      <a href="/menu/" title="Main menu">NetAI</a>
      <a href="/cascade/" title="Cascade LLM"><strong>Cascade LLM</strong></a>
    </div>
    <button data-theme-toggle class="netai-theme-toggle" aria-label="Switch theme"></button>
    </div>
  </header>
  <main>
    <div class="cards">
      <div class="card"><div class="label">Total Requests</div><div class="value cyan" id="requests-total">—</div></div>
      <div class="card"><div class="label">Uptime</div><div class="value green" id="uptime">—</div></div>
      <div class="card"><div class="label">Providers</div><div class="value purple" id="providers-count">—</div></div>
      <div class="card"><div class="label">Fallbacks</div><div class="value pink" id="fallback-count">—</div></div>
      <div class="card"><div class="label">Session Cache</div><div class="value cyan" id="cache-entries">—</div></div>
      <div class="card"><div class="label">Multimodal</div><div class="value green" id="multimodal">—</div></div>
    </div>
    <div class="charts">
      <div class="chart-box">
        <h3>Requests by Backend</h3>
        <canvas id="backendChart"></canvas>
      </div>
      <div class="chart-box">
        <h3>Distribution</h3>
        <canvas id="distChart"></canvas>
      </div>
    </div>
    <div class="provider-section">
      <h3>Configured Providers</h3>
      <table>
        <thead><tr><th>Name</th><th>Type</th><th>Models</th><th>Status</th></tr></thead>
        <tbody id="providers-table"><tr><td colspan="4" style="color:var(--text-faint)">Loading...</td></tr></tbody>
      </table>
    </div>
    <div class="provider-section" id="local-models-section" style="display:none;">
      <h3>Local Models</h3>
      <table>
        <thead><tr><th>Name</th><th>Type</th><th>URL</th><th>Models</th><th>Status</th></tr></thead>
        <tbody id="local-models-table"><tr><td colspan="5" style="color:var(--text-faint)">No local models configured</td></tr></tbody>
      </table>
    </div>
  </main>
  <footer>Cascade LLM Gateway v0.2.0 — NetAI Stack SE</footer>
  <script>
    const backendData = {};
    let backendChart, distChart;
    function isLight() { return document.documentElement.getAttribute('data-theme') === 'light'; }
    function hexA(hex, a) {
      const r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
      return `rgba(${r},${g},${b},${a})`;
    }
    function chartPalette() {
      const L = isLight();
      return {
        c1: L ? '#0891b2' : '#00ffff',
        c2: L ? '#7c3aed' : '#a78bfa',
        c3: L ? '#db2777' : '#ec4899',
        c4: L ? '#059669' : '#34d399',
        c5: L ? '#d97706' : '#f59e0b',
        tick: L ? '#475569' : '#64748b',
        legend: L ? '#475569' : '#94a3b8',
        grid: L ? 'rgba(15,23,42,0.06)' : 'rgba(255,255,255,0.03)'
      };
    }
    function applyPalette() {
      const p = chartPalette();
      backendChart.data.datasets[0].backgroundColor = [hexA(p.c1,0.2), hexA(p.c2,0.2), hexA(p.c3,0.2), hexA(p.c4,0.2)];
      backendChart.data.datasets[0].borderColor = [p.c1, p.c2, p.c3, p.c4];
      distChart.data.datasets[0].backgroundColor = [p.c1, p.c2, p.c3, p.c4, p.c5];
      backendChart.options.scales.x.ticks.color = p.tick;
      backendChart.options.scales.y.ticks.color = p.tick;
      backendChart.options.scales.x.grid.color = p.grid;
      backendChart.options.scales.y.grid.color = p.grid;
      distChart.options.plugins.legend.labels.color = p.legend;
      backendChart.update();
      distChart.update();
    }
    function initCharts() {
      const p = chartPalette();
      const ctx1 = document.getElementById('backendChart').getContext('2d');
      backendChart = new Chart(ctx1, {
        type: 'bar',
        data: { labels: [], datasets: [{ label: 'Requests', data: [], backgroundColor: [hexA(p.c1,0.2), hexA(p.c2,0.2), hexA(p.c3,0.2), hexA(p.c4,0.2)], borderColor: [p.c1, p.c2, p.c3, p.c4], borderWidth: 1 }] },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: p.tick }, grid: { color: p.grid } }, y: { ticks: { color: p.tick }, grid: { color: p.grid } } } }
      });
      const ctx2 = document.getElementById('distChart').getContext('2d');
      distChart = new Chart(ctx2, {
        type: 'doughnut',
        data: { labels: [], datasets: [{ data: [], backgroundColor: [p.c1, p.c2, p.c3, p.c4, p.c5] }] },
        options: { responsive: true, plugins: { legend: { labels: { color: p.legend, font: { size: 11 } } } } }
      });
      window.addEventListener('netai-theme-changed', applyPalette);
    }
    function formatUptime(s) {
      const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
      return h > 0 ? `${h}h ${m}m` : `${m}m`;
    }
    async function refresh() {
      try {
        const r = await fetch('api/dashboard');
        const d = await r.json();
        document.getElementById('requests-total').textContent = d.requests_total || 0;
        document.getElementById('uptime').textContent = formatUptime(d.uptime_seconds || 0);
        document.getElementById('fallback-count').textContent = d.fallback_count || 0;
        document.getElementById('cache-entries').textContent = d.session_cache_entries || 0;
        document.getElementById('multimodal').textContent = d.large_model_multimodal ? 'Yes' : 'No';
        const backends = d.requests_by_backend || {};
        const labels = Object.keys(backends);
        const values = Object.values(backends);
        backendChart.data.labels = labels;
        backendChart.data.datasets[0].data = values;
        backendChart.update('none');
        distChart.data.labels = labels;
        distChart.data.datasets[0].data = values;
        distChart.update('none');
      } catch(e) { console.error('Dashboard refresh error:', e); }
      try {
        const r = await fetch('api/providers');
        const providers = await r.json();
        document.getElementById('providers-count').textContent = providers.length;
        const tbody = document.getElementById('providers-table');
        if (providers.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="color:var(--text-faint)">No external providers configured. Add one in <a href="settings" style="color:var(--accent)">Settings</a>.</td></tr>';
        } else {
          tbody.innerHTML = providers.map(p => `<tr><td>${p.name}</td><td>${p.provider_type.type || p.provider_type}</td><td>${p.models.join(', ')}</td><td><span class="badge ${p.enabled ? 'badge-active' : 'badge-inactive'}">${p.enabled ? 'Active' : 'Disabled'}</span></td></tr>`).join('');
        }
      } catch(e) {}
      try {
        const r = await fetch('models');
        const models = await r.json();
        const localModels = models.data.filter(m => m.owned_by === 'netai-stack' || m.owned_by === 'llamacpp');
        const tbody = document.getElementById('local-models-table');
        if (localModels.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="color:var(--text-faint)">No local models configured</td></tr>';
        } else {
          tbody.innerHTML = localModels.map(m => `<tr><td>${m.id}</td><td>${m.model_type || 'Unknown'}</td><td>${m.owned_by}</td><td>${m.id}</td><td><span class="badge badge-active">Active</span></td></tr>`).join('');
        }
        document.getElementById('local-models-section').style.display = 'block';
      } catch(e) { console.error('Local models fetch error:', e); }
    }
    initCharts();
    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
